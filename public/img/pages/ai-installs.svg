         tab curves, top/bottom tabs and left/right blanks. Translation only. -->
    <path id="store-piece" d="M0 0 H69 C76 0 76 -4 73 -10 C64 -27 73 -36 87 -36 C101 -36 110 -27 101 -10 C98 -4 98 0 105 0 H156 Q174 0 174 18 V55 C174 62 170 62 164 59 C147 50 138 59 138 73 C138 87 147 96 164 87 C170 84 174 84 174 91 V146 H105 C98 146 98 150 101 156 C110 173 101 182 87 182 C73 182 64 173 73 156 C76 150 76 146 69 146 H0 V91 C0 84 4 84 10 87 C27 96 36 87 36 73 C36 59 27 50 10 59 C4 62 0 62 0 55 V0 Z"/>
    <!-- Clip one continuous storefront to the exact union of the five placed cells. -->
    <clipPath id="storefront-placed-pieces" clipPathUnits="userSpaceOnUse">
      <path transform="translate(0 0)" d="M18 0 H174 V55 C174 62 178 62 184 59 C201 50 210 59 210 73 C210 87 201 96 184 87 C178 84 174 84 174 91 V146 H105 C98 146 98 150 101 156 C110 173 101 182 87 182 C73 182 64 173 73 156 C76 150 76 146 69 146 H0 V18 Q0 0 18 0 Z"/>
