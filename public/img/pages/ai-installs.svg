      <path d="M348 146 V201 C348 208 352 208 358 205 C375 196 384 205 384 219 C384 233 375 242 358 233 C352 230 348 230 348 237 V292"/>
    </g>
    <!-- Full missing-piece perimeter, including the shared left and bottom seams. -->
