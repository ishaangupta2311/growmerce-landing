      <path transform="translate(174 146)" d="M0 0 H69 C76 0 76 4 73 10 C64 27 73 36 87 36 C101 36 110 27 101 10 C98 4 98 0 105 0 H174 V55 C174 62 178 62 184 59 C201 50 210 59 210 73 C210 87 201 96 184 87 C178 84 174 84 174 91 V146 H0 V91 C0 84 4 84 10 87 C27 96 36 87 36 73 C36 59 27 50 10 59 C4 62 0 62 0 55 V0 Z"/>
      <path transform="translate(348 146)" d="M0 0 H69 C76 0 76 4 73 10 C64 27 73 36 87 36 C101 36 110 27 101 10 C98 4 98 0 105 0 H174 V128 Q174 146 156 146 H0 V91 C0 84 4 84 10 87 C27 96 36 87 36 73 C36 59 27 50 10 59 C4 62 0 62 0 55 V0 Z"/>
