<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590">
  <title>It joins the store you already run</title>
  <desc>Five interlocking white pieces surround a cream, dashed jigsaw socket. A continuous storefront is clipped to the placed pieces, leaving its search field missing. An identically sized Growsearch piece approaches that socket from just above and to the right.</desc>
  <defs>
